<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instructor Portal | CTU Danao Room Management</title>
    <link rel="icon" type="image/png" href="/assets/ctudanaologo.png">

    <!-- SECURITY: Immediate authentication check - BLOCKS page rendering if not authenticated -->
    <script>
        // Check authentication IMMEDIATELY before page renders
        (function () {
            const currentUserStr = localStorage.getItem('ctu_current_user');
            if (!currentUserStr || currentUserStr === 'null' || currentUserStr === '') {
                console.warn('❌ UNAUTHORIZED ACCESS: Redirecting to login');
                window.location.replace('/html/Login.html');
                return;
            }

            try {
                const currentUser = JSON.parse(currentUserStr);
                if (!currentUser || currentUser.role !== 'instructor') {
                    console.warn('❌ FORBIDDEN: Instructor role required');
                    window.location.replace('/html/Login.html');
                    return;
                }
            } catch (e) {
                console.error('Auth error:', e);
                window.location.replace('/html/Login.html');
                return;
            }
        })();
    </script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/instructor.css">
    <link rel="stylesheet" href="/css/modal.css">
    <link rel="stylesheet" href="/css/notifications.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="/css/instructor-mobile.css">
</head>

<body>

    <!-- INSTRUCTOR DASHBOARD -->
    <div id="instructorView" class="dashboard-wrapper">
        <!-- Mobile Header -->
        <header class="mobile-top-header">
            <div class="mobile-header-top">
                <div class="mobile-profile-section">
                    <div class="mobile-profile-avatar" id="mobileInstructorAvatar" onclick="openProfileModal()">👤</div>
                    <span class="mobile-profile-username" id="mobileInstructorUsername">Profile</span>
                </div>

                <div class="mobile-controls">
                    <select class="mobile-room-filter" id="mobileRoomFilter" onchange="filterRoomsByStatus(this.value)">
                        <option value="all">All Rooms</option>
                        <option value="available">Available</option>
                        <option value="locked">Locked</option>
                        <option value="meeting">Meeting</option>
                        <option value="maintenance">Maintenance</option>
                    </select>
                </div>
            </div>

            <div class="mobile-search-container">
                <input type="text" class="mobile-search-bar" id="mobileRoomSearch" placeholder="Search room..."
                    onkeyup="filterRoomsBySearch(this.value)">
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Available Rooms Tab -->
            <div id="availableTab" class="container instructor-container">
                <div id="availableRoomsGrid" class="rooms-grid">
                    <!-- Rooms will be populated here -->
                </div>

                <div id="noAvailableRooms" class="no-data-message" style="display: none;">
                    <p>No available rooms found.</p>
                </div>
            </div>

            <!-- My Schedules Tab -->
            <div id="mySchedulesTab" class="container instructor-container" style="display: none;">
                <div class="schedules-list" id="mySchedulesList">
                    <!-- My schedules will be populated here -->
                </div>

                <div id="noMySchedules" class="no-data-message" style="display: none;">
                    <p>You don't have any scheduled rooms yet.</p>
                </div>
            </div>

            <!-- Pending Requests Tab -->
            <div id="requestsTab" class="container instructor-container" style="display: none;">
                <div class="requests-list" id="pendingRequestsList">
                    <!-- Pending requests will be populated here -->
                </div>

                <div id="noPendingRequests" class="no-data-message" style="display: none;">
                    <p>No pending requests.</p>
                </div>
            </div>
        </main>

        <!-- Mobile Bottom Navigation -->
        <nav class="mobile-bottom-nav">
            <button class="nav-btn active" onclick="switchInstructorTab('available')">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Home</span>
            </button>
            <button class="nav-btn" onclick="switchInstructorTab('myschedules')">
                <span class="nav-icon">⏳</span>
                <span class="nav-text">Pending</span>
                <span class="nav-badge" id="pendingBadge" style="display: none;"></span>
            </button>
            <button class="nav-btn" onclick="switchInstructorTab('requests')">
                <span class="nav-icon">📋</span>
                <span class="nav-text">Request</span>
                <span class="nav-badge" id="requestBadge" style="display: none;"></span>
            </button>
            <button class="nav-btn" onclick="logout()">
                <span class="nav-icon">🚪</span>
                <span class="nav-text">Logout</span>
            </button>
        </nav>

        <!-- Hidden Desktop Sidebar (for larger screens) -->
        <aside class="sidebar instructor-sidebar desktop-only">
            <div class="sidebar-header-box">
                <h3> INSTRUCTOR PORTAL</h3>
            </div>

            <div class="instructor-profile profile-section">
                <div class="profile-avatar" id="instructorAvatar">CTU</div>
                <div class="profile-info">
                    <span class="profile-name" id="instructorName">Instructor Name</span>
                    <span class="profile-role">Department of Technology</span>
                </div>
            </div>

            <div class="instructor-menu">
                <button class="menu-btn active" onclick="switchInstructorTab('available')">
                    <span>🏠</span> Available Rooms
                </button>
                <button class="menu-btn" onclick="switchInstructorTab('myschedules')">
                    <span>📅</span> My Schedules
                    <span class="badge" id="myScheduleCount">0</span>
                </button>
                <button class="menu-btn" onclick="switchInstructorTab('requests')">
                    <span>⏳</span> Pending Requests
                    <span class="badge" id="pendingRequestCount">0</span>
                </button>
            </div>

            <div class="instructor-stats">
                <div class="stat-box">
                    <span class="stat-number" id="instTotalRequests">0</span>
                    <span class="stat-label">Total Requests</span>
                </div>
                <div class="stat-box">
                    <span class="stat-number" id="instApprovedCount">0</span>
                    <span class="stat-label">Approved</span>
                </div>
            </div>

            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </aside>
    </div>

    <!-- REQUEST MODAL -->
    <div id="requestModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3> Request Room Schedule</h3>
                <button class="btn-close" onclick="closeRequestModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="room-preview">
                    <span class="room-number" id="requestRoomNumber">Room 101</span>
                    <span class="room-category" id="requestRoomCategory">Comlab Room</span>
                </div>

                <div class="form-group">
                    <label>Requested Status</label>
                    <div class="request-type-options">
                        <label class="radio-label">
                            <input type="radio" name="requestStatus" value="locked" checked>
                            <span class="radio-text">🔒 Locked</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="requestStatus" value="meeting">
                            <span class="radio-text">👥 Meeting</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="requestStatus" value="maintenance">
                            <span class="radio-text">🔧 Maintenance</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="requestDate" min="">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Start Time</label>
                        <input type="time" id="requestStartTime">
                    </div>
                    <div class="form-group">
                        <label>End Time</label>
                        <input type="time" id="requestEndTime">
                    </div>
                </div>

                <div class="form-group">
                    <label>Purpose / Activity</label>
                    <textarea id="requestPurpose" rows="3"
                        placeholder="Describe the purpose of this room request..."></textarea>
                </div>

                <div class="conflict-warning" id="conflictWarning" style="display: none;">
                    <span>⚠️</span> This time slot conflicts with an existing schedule.
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeRequestModal()">Cancel</button>
                <button class="btn-submit" onclick="submitRequest()">Submit Request</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/helpers.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/js/utils/storage.js"></script>
    <script src="/js/utils/auth-guard.js"></script>
    <script src="/js/utils/notifications.js"></script>
    <script src="/js/utils/helpers.js"></script>
    <script src="/js/auth/login.js"></script>
    <script src="/js/instructor/dashboard.js"></script>
    <script src="/js/instructor/requests.js"></script>
    <script src="/js/utils/mobile-helper.js"></script>
    <script>
        // Initialize Socket.io for real-time synchronization
        const socket = io();

        socket.on('connect', () => {
            console.log('✅ Connected to server for real-time sync');
            showNotification('Connected', 'Real-time synchronization active', 'success', 3000);
        });

        socket.on('disconnect', () => {
            console.log('❌ Disconnected from server');
            showNotification('Disconnected', 'Using local cache until reconnection', 'warning', 5000);
        });

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {
            // CHECK AUTHENTICATION - REDIRECT IF NOT AUTHORIZED
            if (!protectPage()) {
                return; // User not authenticated, redirected to login
            }

            const currentUser = getCurrentUser();
            if (!currentUser || currentUser.role !== 'instructor') {
                console.warn('Unauthorized: Not an instructor');
                alert('⛔ Access Denied: Instructor access required');
                window.location.href = '/html/Login.html';
                return;
            }

            initInstructorView();

            // Request notification permission
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        });
    </script>

</body>

</html>
